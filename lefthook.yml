# Repo kit (~/.1dot/kit, applied by `dot kit`). Everything runs locally.
pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: public
      run: tools/public-guard staged
    - name: format
      run: mise run format {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional commit
      run: npx --no -- commitlint --edit {1}
    - name: public
      run: tools/public-guard msg {1}

pre-push:
  jobs:
    - name: check
      run: mise run check
      skip:
        - run: test -f .public-repo
