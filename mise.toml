[tools]
"aqua:supabase/cli" = "2.117.0"
node = "22.23.2"
"npm:eas-cli" = "24.3.0"
java = "temurin-17.0.20+8"
"android-sdk" = "latest"
maestro = "cli-2.12.1"

[tasks.check]
description = "Everything the pre-push hook runs: mobile lint + typecheck + tests, web typecheck + build, unused code (knip)"
run = ["[ -d node_modules ] || npm ci", "npm run check", "npm run build --workspace apps/web"]

[tasks.format]
description = "Prettier on the files given (pre-commit passes the staged ones and restages them)"
run = "npx prettier --write --ignore-unknown"

[tasks.deps]
description = "Outdated packages and Expo SDK mismatches (runs locally instead of Dependabot)"
run = ["npm outdated --workspaces --include-workspace-root || true", "cd apps/mobile && npx expo install --check || true"]

[tasks.e2e]
description = "Maestro flows on the desk emulator against the local demo data (starts Supabase, emulator and Metro if needed)"
run = "bash apps/mobile/scripts/e2e.sh"

[tasks.pictures]
description = "Maestro flows with pictures: on master they become the baseline, on a branch a before/after page"
run = "bash apps/mobile/scripts/pictures.sh"
