<!doctype html>
<html lang="sv">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #0b0e14;
      font-family: Arial, Helvetica, sans-serif;
      color: #e8ecf4;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #151a24;
        border-radius: 16px;
        padding: 32px;
      "
    >
      <h1 style="margin: 0 0 12px; font-size: 22px">Glömt lösenordet?</h1>
      <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
        Lugnt, det händer. Tryck på knappen på mobilen där du har appen så väljer du ett nytt
        lösenord.
      </p>
      <p style="margin: 0 0 24px">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #2f6fed;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 14px 24px;
            border-radius: 999px;
          "
          >Välj nytt lösenord</a
        >
      </p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #9aa4b8">
        Länken gäller i en timme och funkar en gång. Bad du inte om det här kan du strunta i mejlet,
        ditt lösenord är kvar som förut.
      </p>
    </div>
  </body>
</html>
