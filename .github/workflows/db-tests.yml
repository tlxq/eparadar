name: DB Tests

on:
  push:
    branches: [master]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
      - run: supabase start
      - run: supabase test db --local
