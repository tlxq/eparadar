name: DB Tests

on:
  push:
    branches: [master]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Start Supabase (retries on registry rate limits)
        run: |
          for attempt in 1 2 3 4 5; do
            supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor && exit 0
            supabase stop --no-backup || true
            sleep $((attempt * 60))
          done
          exit 1
      - run: supabase test db --local
